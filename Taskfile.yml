version: '3'

vars:
  APP_NAME: "esp32-nvs-manager"
  BIN_DIR: "bin"
  BUILD_DATE: '{{now | date "2006-01-02"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:all:
    summary: Builds Windows (amd64), Linux (amd64) and macOS (amd64, arm64) into bin/
    desc: |
      Uses the official Wails cross-compilation: native Go for Windows, the
      wails-cross Docker image for Linux and macOS (run setup:docker once).
    cmds:
      # windows:build always writes bin/<app>.exe, so rename it.
      # Task's shell has no mv on Windows: use PowerShell there.
      - task: windows:build
        vars: { ARCH: amd64 }
      - cmd: powershell Move-Item -Force "{{.BIN_DIR}}/{{.APP_NAME}}.exe" "{{.BIN_DIR}}/{{.APP_NAME}}-windows-amd64.exe"
        platforms: [windows]
      - cmd: mv -f "{{.BIN_DIR}}/{{.APP_NAME}}.exe" "{{.BIN_DIR}}/{{.APP_NAME}}-windows-amd64.exe"
        platforms: [linux, darwin]
      - task: linux:build
        vars: { ARCH: amd64, OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-linux-amd64" }
      # No Linux arm64: the wails-cross image compiles Linux with its own GCC,
      # so arm64 would need an emulated arm64 copy of the image.
      - task: darwin:build
        vars: { ARCH: amd64, OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-darwin-amd64" }
      - task: darwin:build
        vars: { ARCH: arm64, OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-darwin-arm64" }

